<!-- Medellin Buzz chip (brand-notes §3, Alejo's placas.py look). Filled by build_graphics.py: {{id}}, {{brand_css}},
     {{plate}} (ink|cream|orange), {{text_class}} (t-white|t-ink|t-cream|t-accent), {{words}} (spans, the orange token in .mb-orange), {{dur}}.
     Same geometry as the approved Pillow chip: centered at y 380, brand heavy font 72, padding 26 px, radius 8. -->
<template>
  <style>
    {{brand_css}}
    #{{id}} { position: absolute; inset: 0; }
    #{{id}} .ch-row { position: absolute; left: 0; right: 0; top: 380px; height: 0; display: flex; justify-content: center; align-items: center; }
    #{{id}} .ch-plate { padding: 14px 26px 10px; border-radius: 8px; font-size: 72px; line-height: 84px; white-space: nowrap; }
    #{{id}} .ch-plate.ink { background: var(--mb-ink); }
    #{{id}} .ch-plate.cream { background: var(--mb-cream); }
    #{{id}} .ch-plate.orange { background: var(--mb-orange); }
    #{{id}} .t-white { color: var(--mb-white); }
    #{{id}} .t-ink { color: var(--mb-ink); }
    #{{id}} .t-cream { color: var(--mb-cream); }
    #{{id}} .t-accent { color: var(--mb-orange-text); }
  </style>
  <div id="{{id}}" data-composition-id="{{id}}" data-width="1080" data-height="1920">
    <div class="ch-row">
      <div id="{{id}}-plate" class="ch-plate mb-xb {{plate}} {{text_class}}">{{words}}</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // in: 80 -> 100 % while rising 12 px, 4 frames (Alejo's long-form chip timing)
    tl.fromTo("#{{id}}-plate", { scale: 0.8, y: 12 }, { scale: 1, y: 0, duration: 4 / 30, ease: "expo.out" }, 0);
    // out: down to 64 % while dropping 12 px and fading, 5 frames
    tl.to("#{{id}}-plate", { scale: 0.64, y: 12, opacity: 0, duration: 5 / 30, ease: "power3.in" },
      Math.max({{dur}} - 5 / 30 - 0.01, 4 / 30));
    window.__timelines["{{id}}"] = tl;
  </script>
</template>
